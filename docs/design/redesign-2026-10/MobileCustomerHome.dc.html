<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmops – Customer home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 999px; background: {{accentTint}}; color: {{accentDeep}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">OC</span>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 13px; font-weight: 600; color: #55657A">Welcome back</span>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Hi, Olivia</h1>
</div>
<button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #ffffff; color: #3A4A5C; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(30,42,48,0.08)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a6 6 0 0 0-6 6c0 6.5-3 8.5-3 8.5h18S18 14.5 18 8a6 6 0 0 0-6-6zM9.5 19a2.5 2.5 0 0 0 5 0z"></path></svg>
</button>
</div>

<section style="background: {{accentStrong}}; color: #ffffff; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 24px rgba(7,122,180,0.26)">
<span style="font-size: 13px; font-weight: 700">Your next clean</span>
<span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Wed, Oct 14</span>
<span style="font-size: 15px; font-weight: 600">9:00 AM · Standard clean · every 2 weeks</span>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.16)">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #ffffff; color: {{accentDeep}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">MR</span>
<span style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 14px; font-weight: 700">Maria R.</span>
<span style="font-size: 12px; font-weight: 500">Your cleaner · 4.9 rating</span>
</span>
</div>
<div style="display: flex; gap: 10px; margin-top: 10px">
<button type="button" style="flex-grow: 1; height: 46px; border: 0; border-radius: 12px; background: #ffffff; color: {{accentDeep}}; font: inherit; font-size: 15px; font-weight: 800">Reschedule</button>
<button type="button" style="flex-grow: 1; height: 46px; border: 1.5px solid rgba(255,255,255,0.7); border-radius: 12px; background: transparent; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700">Message</button>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center">
<h2 style="margin: 0; font-size: 17px; font-weight: 800; flex-grow: 1">Book a clean</h2>
<a href="#" style="font-size: 14px; font-weight: 700; text-decoration: none">All services</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{services}}" as="s" hint-placeholder-count="4">
<a href="MobileBook.dc.html" style="height: 94px; box-sizing: border-box; padding: 12px; border-radius: 16px; background: #ffffff; color: #0F1B2A; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<span style="width: 32px; height: 32px; border-radius: 9px; background: {{accentTint}}; color: {{accentDeep}}; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{s.d}}"></path></svg>
</span>
<span style="display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 14px; font-weight: 800; flex-grow: 1">{{s.name}}</span>
<span style="font-size: 13px; font-weight: 700; color: #3A4A5C; font-variant-numeric: tabular-nums">{{s.price}}</span>
</span>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<div style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">
<span style="font-size: 14px; font-weight: 800">How was your deep clean?</span>
<span style="font-size: 12px; color: #55657A">Sep 30 · Maria R. and Jordan T.</span>
</div>
<div style="display: flex; gap: 2px; color: #F59E0B">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
<button type="button" aria-label="{{st.label}}" style="width: 28px; height: 44px; padding: 0; border: 0; background: transparent; color: #CBD5E1; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"></path></svg>
</button>
</sc-for>
</div>
</div>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 999px; background: {{sidebarColor}}; display: flex; box-shadow: 0 10px 24px rgba(30,42,48,0.28)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span style="font-size: 11px; font-weight: 700">{{t.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  mix(hex, a) { return this.hex(this.rgb(hex).map(function (v) { return v + (255 - v) * a; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var accentDeep = this.shade(accent, 0.55);
    var accentTint = this.mix(accent, 0.86);
    var deep = this.shade(sidebarColor, 0.62);
    var services = [
      { name: 'Standard', price: 'from $165', d: 'M12 3 2 11h3v9h5v-6h4v6h5v-9h3z' },
      { name: 'Deep clean', price: 'from $320', d: 'M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4zM19 16l1 2.5 2.5 1-2.5 1L19 23l-1-2.5-2.5-1 2.5-1z' },
      { name: 'Move in/out', price: 'from $385', d: 'M2 7h12v10H2zM14 10h4l4 4v3h-8zM6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm12 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z' },
      { name: 'Airbnb', price: 'from $140', d: 'M7 7a5 5 0 1 1 4.9 6H14v2h2v2h-2v2h-3v-6.1A5 5 0 0 1 7 7zm5-1.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z' }
    ];
    var stars = [1, 2, 3, 4, 5].map(function (n) { return { label: 'Rate ' + n + ' star' + (n > 1 ? 's' : '') }; });
    var I = {
      home: 'M12 3 2 11h3v9h5v-6h4v6h5v-9h3z',
      book: 'M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z',
      bookings: 'M7 2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2zM5 10v10h14V10z',
      chat: 'M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z',
      account: 'M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 12c5 0 9 2.5 9 6v2H3v-2c0-3.5 4-6 9-6z'
    };
    var tabs = [['Home', I.home, 'MobileCustomerHome.dc.html'], ['Book', I.book, 'MobileBook.dc.html'], ['Bookings', I.bookings, 'MobileBookings.dc.html'], ['Messages', I.chat], ['Account', I.account]].map(function (t, i) {
      var on = i === 0;
      return { label: t[0], d: t[1], href: t[2] || '#',
        style: 'flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; text-decoration: none; ' + (on ? 'background: #ffffff; color: ' + deep : 'color: #ffffff') };
    });
    return { sidebarColor: sidebarColor, accentStrong: accentStrong, accentDeep: accentDeep, accentTint: accentTint, services: services, stars: stars, tabs: tabs };
  }
}
</script>
</body>
</html>
