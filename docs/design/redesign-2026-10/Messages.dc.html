<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; overflow: hidden">
<dc-import name="Sidebar" active="Messages" accent="{{accent}}" sidebar="{{sidebarColor}}" hint-size="248px,900px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #E5EAF0; display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; flex-grow: 1">Messages</h1>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accentStrong}}; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
New message
</button>
</header>
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px">
<div style="height: 100%; display: flex; background: #ffffff; border: 1px solid #E5EAF0; border-radius: 10px; overflow: hidden">

<div style="width: 340px; flex-shrink: 0; border-right: 1px solid #E5EAF0; display: flex; flex-direction: column">
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E5EAF0">
<label style="display: flex; align-items: center; gap: 8px; height: 38px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; color: #55657A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search conversations</span>
<input type="search" placeholder="Search conversations" style="border: 0; outline: none; font: inherit; font-size: 14px; flex-grow: 1; min-width: 0; background: transparent; color: #0F1B2A">
</label>
<div role="group" aria-label="Filter" style="display: flex; padding: 3px; border-radius: 8px; background: #F1F5F9">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
</div>
<sc-for list="{{convos}}" as="c" hint-placeholder-count="8">
<button type="button" onClick="{{c.pick}}" style="{{c.row}}">
<span style="{{c.av}}">{{c.i}}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; gap: 2px">
<span style="display: flex; gap: 8px">
<span style="font-size: 14px; font-weight: 700; flex-grow: 1; text-align: left">{{c.name}}</span>
<span style="font-size: 12px; color: #55657A">{{c.when}}</span>
</span>
<span style="display: flex; gap: 8px; align-items: center">
<span style="font-size: 13px; color: #55657A; flex-grow: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span>
<sc-if value="{{c.unread}}" hint-placeholder-val="{{ false }}">
<span style="{{c.badge}}">{{c.unread}}</span>
</sc-if>
</span>
</span>
</button>
</sc-for>
</div>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-bottom: 1px solid #E5EAF0; display: flex; align-items: center; gap: 12px">
<span style="{{sel.av}}">{{sel.i}}</span>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 15px; font-weight: 700">{{sel.name}}</span>
<span style="font-size: 12px; color: #55657A">{{sel.meta}}</span>
</div>
<button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 13px; font-weight: 600">Call</button>
<a href="Clients.dc.html" style="height: 36px; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center">View client</a>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; background: #F8FAFC; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: center; font-size: 12px; font-weight: 600; color: #55657A; padding: 4px 10px; border-radius: 999px; background: #F1F5F9">Today</span>
<sc-for list="{{thread}}" as="m" hint-placeholder-count="6">
<div style="{{m.wrap}}">
<div style="{{m.bubble}}">{{m.text}}</div>
<span style="font-size: 11px; color: #55657A">{{m.meta}}</span>
</div>
</sc-for>
</div>
<div style="flex-shrink: 0; border-top: 1px solid #E5EAF0; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 8px; align-items: center">
<span style="font-size: 12px; font-weight: 700; color: #55657A">Suggested</span>
<sc-for list="{{suggest}}" as="s" hint-placeholder-count="3">
<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid {{accentLine}}; border-radius: 999px; background: {{accentTint}}; color: {{accentDeep}}; font: inherit; font-size: 13px; font-weight: 600">{{s}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: flex-end">
<label style="flex-grow: 1; display: flex; border: 1px solid #D7DEE7; border-radius: 10px; padding: 10px 12px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</span>
<textarea rows="2" placeholder="Write a message…" style="border: 0; outline: none; resize: none; font: inherit; font-size: 14px; flex-grow: 1; color: #0F1B2A; background: transparent"></textarea>
</label>
<button type="button" aria-label="Send" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: {{accentStrong}}; color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5l2.5 7L15 12l-9.5 1.5z"></path></svg>
</button>
</div>
</div>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'All', sel: 0 }; }
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  mix(hex, a) { return this.hex(this.rgb(hex).map(function (v) { return v + (255 - v) * a; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var accentDeep = this.shade(accent, 0.55);
    var accentTint = this.mix(accent, 0.9);
    var accentLine = this.mix(accent, 0.65);
    var selBg = this.mix(accent, 0.93);
    var filters = ['All', 'Clients', 'Staff', 'Unread'].map(function (f) {
      var on = self.state.filter === f;
      return { label: f, on: on ? 'true' : 'false', pick: function () { self.setState({ filter: f }); },
        style: 'flex-grow: 1; height: 30px; border: 0; border-radius: 6px; font: inherit; font-size: 13px; ' + (on ? 'background: #ffffff; color: #0F1B2A; font-weight: 700; box-shadow: 0 1px 2px rgba(30,42,48,0.12)' : 'background: transparent; color: #475569; font-weight: 600') };
    });
    var pal = [['#E0F2FE', '#0369A1'], ['#EDE9FE', '#6D28D9'], ['#FEF3C7', '#92400E'], ['#DCFCE7', '#15803D']];
    var data = [
      ['Olivia Chen', 'Client · 214 Aspen Ridge Pl SW', 'Could they also do the inside of the fridge?', '9:42 AM', 2],
      ['Maria Reyes', 'Staff · Crew A', 'Running 5 min late to Priya’s, traffic on Deerfoot', '9:31 AM', 1],
      ['Harbor Dental Clinic', 'Client · Commercial', 'Thanks, the invoice is paid now.', '8:55 AM', 0],
      ['Hannah Lee', 'Client · 907 Evanston Dr NW', 'I updated my card, please retry.', 'Yesterday', 0],
      ['Web booking · Nora S.', 'Lead · website', 'Do you bring your own supplies?', 'Yesterday', 1],
      ['Jordan Taylor', 'Staff · Crew A', 'Photos uploaded for Evergreen Way', 'Mon', 0],
      ['Grace Kim', 'Client · Airbnb host', 'Checkout is 11, guests arrive at 4.', 'Mon', 0],
      ['Daniel Ortiz', 'Client · 42 Evergreen Way SW', 'All good now, thank you!', 'Sep 27', 0]
    ];
    var convos = data.map(function (d, i) {
      var p = pal[i % 4];
      var on = self.state.sel === i;
      var ini = d[0].split(' ').filter(function (w) { return /^[A-Z]/.test(w); }).map(function (w) { return w[0]; }).slice(0, 2).join('');
      return { name: d[0], meta: d[1], last: d[2], when: d[3], unread: d[4] || false, i: ini,
        pick: function () { self.setState({ sel: i }); },
        row: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid #F1F5F9; font: inherit; color: #0F1B2A; cursor: pointer; background: ' + (on ? selBg : '#ffffff'),
        av: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: ' + p[0] + '; color: ' + p[1],
        badge: 'min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #ffffff; background: ' + accentStrong };
    });
    var sel = convos[this.state.sel] || convos[0];
    var inb = 'max-width: 460px; padding: 10px 14px; border-radius: 14px 14px 14px 4px; background: #ffffff; border: 1px solid #E5EAF0; font-size: 14px; line-height: 1.45';
    var out = 'max-width: 460px; padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: ' + accentStrong + '; color: #ffffff; font-size: 14px; line-height: 1.45';
    var L = 'display: flex; flex-direction: column; gap: 4px; align-items: flex-start';
    var R = 'display: flex; flex-direction: column; gap: 4px; align-items: flex-end';
    var thread = [
      { text: 'Hi! Maria and Jordan just arrived, thank you.', meta: 'Olivia · 8:06 AM', wrap: L, bubble: inb },
      { text: 'Great to hear. They’ll send photos when each room is done.', meta: 'You · 8:10 AM', wrap: R, bubble: out },
      { text: 'Perfect. The dog is in the backyard, the patio door is locked.', meta: 'Olivia · 8:12 AM', wrap: L, bubble: inb },
      { text: 'Noted, I’ve passed that on to the crew.', meta: 'You · 8:14 AM', wrap: R, bubble: out },
      { text: 'Could they also do the inside of the fridge?', meta: 'Olivia · 9:42 AM', wrap: L, bubble: inb },
      { text: 'It’s packed, so maybe 20 extra minutes.', meta: 'Olivia · 9:42 AM', wrap: L, bubble: inb }
    ];
    var suggest = ['Yes, add inside fridge ($40)', 'Let me check with the crew', 'Book it for next visit'];
    return { accent: accent, sidebarColor: sidebarColor, accentStrong: accentStrong, accentDeep: accentDeep, accentTint: accentTint, accentLine: accentLine, filters: filters, convos: convos, sel: sel, thread: thread, suggest: suggest };
  }
}
</script>
</body>
</html>
