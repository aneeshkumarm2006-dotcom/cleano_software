<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 248px; height: 900px; box-sizing: border-box; background: {{sidebar}}; color: #ffffff; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 12px; gap: 14px">
<button type="button" style="display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 10px; background: {{deep}}; color: #ffffff; font: inherit; text-align: left; cursor: pointer">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; background: #ffffff; color: {{sidebar}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px">B</span>
<span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
<span style="font-weight: 700; font-size: 15px">Bookmops</span>
<span style="font-size: 12px">Calgary · Admin</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.28); border-radius: 8px; background: transparent; color: #ffffff; font: inherit; font-size: 14px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
<span style="flex-grow: 1; text-align: left">Search</span>
<span style="font-size: 12px; font-weight: 600">⌘K</span>
</button>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 12px 4px">{{sec.label}}</div>
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="{{it.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{it.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
<span style="flex-grow: 1">{{it.label}}</span>
<sc-if value="{{it.count}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #ffffff; color: #3A4A5C; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.count}}</span>
</sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid rgba(255,255,255,0.22)">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #ffffff; color: #3A4A5C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">PS</span>
<span style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 14px; font-weight: 600">Prem Sai</span>
<span style="font-size: 12px">Owner</span>
</span>
<button type="button" aria-label="Sign out" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
</button>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Dashboard","Calendar","Analytics","Jobs","Clients","Requests","Messages","Employees","Time Tracking","Invoices","Payouts","Settings"],"default":"Dashboard"},"sidebar":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  shade(hex, f) {
    var h = String(hex || '#2B3337').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
      var x = Math.max(0, Math.min(255, Math.round(v * f)));
      return ('0' + x.toString(16)).slice(-2);
    }).join('');
  }
  mix(hex, a) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    var n = parseInt(h, 16);
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
      var x = Math.round(v + (255 - v) * a);
      return ('0' + x.toString(16)).slice(-2);
    }).join('');
  }
  renderVals() {
    var sidebar = this.props.sidebar ?? '#2B3337';
    var accent = this.props.accent ?? '#1B9ADB';
    var active = this.props.active ?? 'Dashboard';
    var deep = this.mix(sidebar, 0.1); var activeBg = this.mix(sidebar, 0.16);
    var accentLight = this.mix(accent, 0.45);
    var base = 'display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500;';
    var I = {
      dashboard: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      calendar: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',
      analytics: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      jobs: 'M9 3h6v4H9zM5 5h14v16H5zM9 12h6M9 16h4',
      clients: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      requests: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z',
      messages: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
      employees: 'M3 5h18v14H3zM7 15c.5-2 2-3 3-3s2.5 1 3 3M10 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM15 9h3M15 13h3',
      time: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
      invoices: 'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h6',
      payouts: 'M3 7h18v13H3zM3 7l3-4h12l3 4M16 13h2',
      settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'
    };
    var sections = [
      { label: 'Overview', items: [
        { label: 'Dashboard', d: I.dashboard, href: 'Main.dc.html' },
        { label: 'Calendar', d: I.calendar, href: 'Calendar.dc.html' },
        { label: 'Analytics', d: I.analytics, href: '#' }
      ] },
      { label: 'Operations', items: [
        { label: 'Jobs', d: I.jobs, href: 'Jobs.dc.html' },
        { label: 'Clients', d: I.clients, href: 'Clients.dc.html' },
        { label: 'Requests', d: I.requests, href: '#', count: 4 },
        { label: 'Messages', d: I.messages, href: 'Messages.dc.html', count: 7 }
      ] },
      { label: 'Staff', items: [
        { label: 'Employees', d: I.employees, href: 'Employees.dc.html' },
        { label: 'Time Tracking', d: I.time, href: '#' }
      ] },
      { label: 'Finance', items: [
        { label: 'Invoices', d: I.invoices, href: 'Invoices.dc.html' },
        { label: 'Payouts', d: I.payouts, href: '#' }
      ] },
      { label: 'Admin', items: [
        { label: 'Settings', d: I.settings, href: '#' }
      ] }
    ];
    sections.forEach(function (s) {
      s.items.forEach(function (it) {
        var on = it.label === active;
        it.style = base + (on ? ' background: ' + activeBg + '; font-weight: 700;' : '');
        it.iconColor = on ? accentLight : '#ffffff';
        it.count = it.count || false;
      });
    });
    return { sidebar: sidebar, deep: deep, sections: sections };
  }
}
</script>
</body>
</html>
