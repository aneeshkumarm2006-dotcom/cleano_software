<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmops Pro – Available jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #55657A">9 open near you</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Available jobs</h1>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
<article style="background: #ffffff; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">
<span style="font-size: 12px; font-weight: 700; color: #55657A">{{j.when}}</span>
<span style="font-size: 16px; font-weight: 800">{{j.service}}</span>
<span style="font-size: 13px; color: #3A4A5C">{{j.area}} · {{j.dist}} · {{j.hours}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end">
<span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">{{j.pay}}</span>
<span style="{{j.tagStyle}}">{{j.tag}}</span>
</div>
</div>
<button type="button" onClick="{{j.claim}}" style="{{j.btn}}">{{j.btnLabel}}</button>
</article>
</sc-for>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 999px; background: {{sidebarColor}}; display: flex; box-shadow: 0 10px 24px rgba(30,42,48,0.28)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span style="font-size: 11px; font-weight: 700">{{t.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { chip: 'This week', claimed: {} }; }
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var deep = this.shade(sidebarColor, 0.62);
    var chips = ['This week', 'Next week', 'Under 10 km'].map(function (c) {
      var on = self.state.chip === c;
      return { label: c, on: on ? 'true' : 'false', pick: function () { self.setState({ chip: c }); },
        style: 'height: 36px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; ' + (on ? 'border: 0; background: ' + accentStrong + '; color: #ffffff' : 'border: 1px solid #D7DEE7; background: #ffffff; color: #0F1B2A') };
    });
    var data = [
      ['Thu, Oct 1 · 1:00 PM', 'Deep clean', 'Mahogany SE', '9 km', '3.5 h', '$84', '+$10 bonus', 1],
      ['Fri, Oct 2 · 9:00 AM', 'Move-out clean', 'Bridgeland NE', '12 km', '3 h', '$72', 'Empty home', 0],
      ['Fri, Oct 2 · 2:00 PM', 'Airbnb turnover', 'Kensington NW', '4 km', '1.5 h', '$36', 'Same day', 0],
      ['Sat, Oct 3 · 10:00 AM', 'Standard clean', 'Evanston NW', '15 km', '2 h', '$48', '+$8 weekend', 1]
    ];
    var jobs = data.map(function (d, i) {
      var got = !!self.state.claimed[i];
      return { when: d[0], service: d[1], area: d[2], dist: d[3], hours: d[4], pay: d[5], tag: d[6],
        tagStyle: 'font-size: 12px; font-weight: 800; color: ' + (d[7] ? '#15803D' : '#55657A'),
        claim: function () { var n = Object.assign({}, self.state.claimed); n[i] = true; self.setState({ claimed: n }); },
        btnLabel: got ? 'Claimed' : 'Claim',
        btn: 'height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 800; ' + (got ? 'background: #DCFCE7; color: #15803D' : 'background: ' + accentStrong + '; color: #ffffff') };
    });
    var I = {
      today: 'M12 3 2 11h3v9h5v-6h4v6h5v-9h3z',
      jobs: 'M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1zm-1 9v2h8v-2zm0 4v2h5v-2z',
      pay: 'M3 6a2 2 0 0 1 2-2h13v3h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm13 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z',
      chat: 'M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z',
      more: 'M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z'
    };
    var tabs = [['Today', I.today, 'MobileToday.dc.html'], ['Jobs', I.jobs, 'MobileAvailable.dc.html'], ['Pay', I.pay, 'MobilePay.dc.html'], ['Chat', I.chat, '#'], ['More', I.more, '#']].map(function (t, i) {
      var on = i === 1;
      return { label: t[0], d: t[1], href: t[2],
        style: 'flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; text-decoration: none; ' + (on ? 'background: #ffffff; color: ' + deep : 'color: #ffffff') };
    });
    return { sidebarColor: sidebarColor, chips: chips, jobs: jobs, tabs: tabs };
  }
}
</script>
</body>
</html>
