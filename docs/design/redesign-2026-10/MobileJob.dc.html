<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmops Pro – Job on the clock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="MobileToday.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; border-radius: 999px; background: #ffffff; color: #0F1B2A; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(30,42,48,0.08)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4-1.8 1.8L4.4 12l9.2-9.2z"></path></svg>
</a>
<span style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 800">Job details</span>
<button type="button" aria-label="More options" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #ffffff; color: #0F1B2A; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(30,42,48,0.08)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path></svg>
</button>
</div>

<div style="background: #ffffff; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Olivia Chen</h1>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #3A4A5C">
<svg width="16" height="16" viewBox="0 0 24 24" fill="{{accentStrong}}" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"></path></svg>
214 Aspen Ridge Pl SW, Calgary
</span>
<div style="display: flex; gap: 6px; margin-top: 4px">
<span style="height: 26px; padding: 0 10px; display: flex; align-items: center; border-radius: 999px; background: #F1F5F9; color: #334155; font-size: 12px; font-weight: 700">Deep clean</span>
<span style="height: 26px; padding: 0 10px; display: flex; align-items: center; border-radius: 999px; background: #F1F5F9; color: #334155; font-size: 12px; font-weight: 700">3 bed · 2 bath</span>
<span style="height: 26px; padding: 0 10px; display: flex; align-items: center; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 700">Dog on site</span>
</div>
</div>

<div style="background: {{accentStrong}}; color: #ffffff; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 8px 20px rgba(7,122,180,0.26)">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
<span style="width: 8px; height: 8px; border-radius: 999px; background: #ffffff"></span>On the clock
</span>
<span style="font-size: 44px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.05">1:40:12</span>
<span style="font-size: 13px; font-weight: 500">Started 8:00 AM · booked until 11:00 AM</span>
<div style="display: flex; gap: 10px; margin-top: 10px">
<button type="button" style="flex-grow: 1; height: 48px; border: 0; border-radius: 12px; background: #ffffff; color: {{accentDeep}}; font: inherit; font-size: 15px; font-weight: 800">Clock out</button>
<button type="button" style="height: 48px; padding: 0 16px; border: 1.5px solid rgba(255,255,255,0.7); border-radius: 12px; background: transparent; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700">Break</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<button type="button" style="height: 72px; border: 0; border-radius: 14px; background: #ffffff; color: #0F1B2A; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{a.color}}" fill-rule="evenodd" aria-hidden="true"><path d="{{a.d}}"></path></svg>
<span style="font-size: 12px; font-weight: 700">{{a.label}}</span>
</button>
</sc-for>
</div>

<div style="background: #ffffff; border-radius: 16px; padding: 14px 16px 6px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<div style="display: flex; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800; flex-grow: 1">Checklist</h2>
<span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">8<span style="font-size: 14px; color: #55657A"> / 14</span></span>
</div>
<div style="height: 8px; margin: 10px 0 6px; border-radius: 999px; background: #F1F5F9; overflow: hidden">
<div style="width: 57%; height: 100%; border-radius: 999px; background: {{accent}}"></div>
</div>
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; height: 48px; border-top: 1px solid #F1F5F9">
<span style="{{r.iconStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{r.d}}"></path></svg>
</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{r.name}}</span>
<span style="{{r.countStyle}}">{{r.count}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
<button type="button" style="width: 100%; height: 54px; border: 0; border-radius: 14px; background: {{sidebarColor}}; color: #ffffff; font: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 24px rgba(30,42,48,0.24)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5zm3 4.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path></svg>
Add after photos
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  mix(hex, a) { return this.hex(this.rgb(hex).map(function (v) { return v + (255 - v) * a; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var accentDeep = this.shade(accent, 0.55);
    var accentTint = this.mix(accent, 0.86);
    var actions = [
      { label: 'Navigate', color: accentStrong, d: 'M21 3 3 10.5l7.5 3 3 7.5z' },
      { label: 'Call', color: accentStrong, d: 'M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z' },
      { label: 'Chat', color: accentStrong, d: 'M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z' },
      { label: 'Issue', color: '#C2410C', d: 'M12 2 1 21h22zm-1 7h2v6h-2zm0 8h2v2h-2z' }
    ];
    var check = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4z';
    var half = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 0 1 0 14z';
    var empty = 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14z';
    var box = function (bg, fg) { return 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: ' + bg + '; color: ' + fg; };
    var cnt = function (done) { return 'font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: ' + (done ? '#15803D' : '#3A4A5C'); };
    var rooms = [
      { name: 'Kitchen', count: '4 / 4', d: check, iconStyle: box('#DCFCE7', '#15803D'), countStyle: cnt(true) },
      { name: 'Bathrooms', count: '2 / 4', d: half, iconStyle: box(accentTint, accentDeep), countStyle: cnt(false) },
      { name: 'Bedrooms', count: '2 / 4', d: half, iconStyle: box(accentTint, accentDeep), countStyle: cnt(false) },
      { name: 'Living room', count: '0 / 2', d: empty, iconStyle: box('#F1F5F9', '#55657A'), countStyle: cnt(false) }
    ];
    return { accent: accent, sidebarColor: sidebarColor, accentStrong: accentStrong, accentDeep: accentDeep, actions: actions, rooms: rooms };
  }
}
</script>
</body>
</html>
