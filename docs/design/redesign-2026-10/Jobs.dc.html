<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; overflow: hidden">
<dc-import name="Sidebar" active="Jobs" accent="{{accent}}" sidebar="{{sidebarColor}}" hint-size="248px,900px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #E5EAF0; display: flex; align-items: center; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-grow: 1">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Jobs</h1>
<span style="font-size: 13px; color: #55657A">248 this month</span>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
Export
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accentStrong}}; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
New job
</button>
</header>

<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px">
<section style="height: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid #E5EAF0; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden">
<div role="tablist" aria-label="Job status" style="height: 52px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-bottom: 1px solid #E5EAF0; display: flex; align-items: stretch; gap: 24px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">
{{t.label}}
<span style="{{t.countStyle}}">{{t.count}}</span>
</button>
</sc-for>
</div>
<div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E5EAF0">
<label style="display: flex; align-items: center; gap: 8px; width: 300px; height: 38px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; color: #55657A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search jobs</span>
<input type="search" placeholder="Search client, address or job #" style="border: 0; outline: none; font: inherit; font-size: 14px; flex-grow: 1; min-width: 0; background: transparent; color: #0F1B2A">
</label>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 14px; cursor: pointer">
<span style="color: #55657A">{{f.k}}:</span>
<span style="font-weight: 600">{{f.v}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</sc-for>
<span style="flex-grow: 1"></span>
<span style="font-size: 13px; color: #55657A">Showing 1–10 of 62</span>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<thead>
<tr style="background: #F8FAFC; height: 42px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #55657A">
<th style="width: 44px; padding: 0 0 0 20px; border-bottom: 1px solid #E5EAF0"><input type="checkbox" aria-label="Select all jobs" style="width: 16px; height: 16px"></th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Date</th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Client</th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Type</th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Crew &amp; pay</th>
<th style="padding: 0 12px; font-weight: 700; text-align: right; border-bottom: 1px solid #E5EAF0">Price</th>
<th style="padding: 0 12px; font-weight: 700; text-align: right; border-bottom: 1px solid #E5EAF0">Margin</th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Status</th>
<th style="padding: 0 20px 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Payment</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr style="height: 56px; border-bottom: 1px solid #F1F5F9">
<td style="padding: 0 0 0 20px"><input type="checkbox" aria-label="Select job" style="width: 16px; height: 16px"></td>
<td style="padding: 0 12px; white-space: nowrap">
<div style="font-weight: 600; font-variant-numeric: tabular-nums">{{r.date}}</div>
<div style="font-size: 12px; color: #55657A">{{r.time}}</div>
</td>
<td style="padding: 0 12px">
<a href="JobDetail.dc.html" style="font-weight: 600; color: #0F1B2A; text-decoration: none">{{r.client}}</a>
<div style="font-size: 12px; color: #55657A">{{r.address}}</div>
</td>
<td style="padding: 0 12px; color: #3A4A5C">{{r.type}}</td>
<td style="padding: 0 12px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex">
<sc-for list="{{r.crew}}" as="c" hint-placeholder-count="2">
<span style="{{c.style}}">{{c.i}}</span>
</sc-for>
</div>
<span style="{{r.payStyle}}">{{r.pay}}</span>
</div>
</td>
<td style="padding: 0 12px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums">{{r.price}}</td>
<td style="padding: 0 12px; text-align: right; font-variant-numeric: tabular-nums; color: #3A4A5C">{{r.margin}}</td>
<td style="padding: 0 12px"><span style="{{r.badge}}">{{r.status}}</span></td>
<td style="padding: 0 20px 0 12px"><span style="{{r.payBadge}}">{{r.payment}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>

<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-top: 1px solid #E5EAF0; display: flex; align-items: center; gap: 8px">
<span style="font-size: 13px; color: #55657A; flex-grow: 1">Page 1 of 7</span>
<button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 13px; font-weight: 600">Previous</button>
<button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 13px; font-weight: 600">Next</button>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'All' }; }
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  mix(hex, a) { return this.hex(this.rgb(hex).map(function (v) { return v + (255 - v) * a; })); }
  pill(bg, fg) { return 'display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: ' + bg + '; color: ' + fg; }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var accentTint = this.mix(accent, 0.88);
    var status = { 'Scheduled': ['#E0F2FE', '#0369A1'], 'In progress': ['#FEF3C7', '#92400E'], 'Completed': ['#DCFCE7', '#15803D'], 'Unassigned': ['#FEE2E2', '#B91C1C'], 'Cancelled': ['#F1F5F9', '#475569'] };
    var pay = { 'Paid': ['#DCFCE7', '#15803D'], 'Card on file': ['#E0F2FE', '#0369A1'], 'Due': ['#FEF3C7', '#92400E'], 'Failed': ['#FEE2E2', '#B91C1C'], 'Refunded': ['#F1F5F9', '#475569'] };
    var av = [['#E0F2FE', '#0369A1'], ['#EDE9FE', '#6D28D9'], ['#FEF3C7', '#92400E'], ['#DCFCE7', '#15803D']];
    var tabDefs = [['All', 62], ['Scheduled', 31], ['In progress', 4], ['Completed', 22], ['Cancelled', 5]];
    var tabs = tabDefs.map(function (t) {
      var on = self.state.tab === t[0];
      return {
        label: t[0], count: t[1], on: on ? 'true' : 'false',
        pick: function () { self.setState({ tab: t[0] }); },
        style: 'display: flex; align-items: center; gap: 8px; padding: 0 2px; border: 0; border-bottom: 2px solid ' + (on ? accent : 'transparent') + '; margin-bottom: -1px; background: transparent; font: inherit; font-size: 14px; cursor: pointer; font-weight: ' + (on ? '700; color: #0F1B2A' : '500; color: #55657A'),
        countStyle: 'font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; ' + (on ? 'background: ' + accentTint + '; color: ' + accentStrong : 'background: #F1F5F9; color: #475569')
      };
    });
    var filters = [{ k: 'Date', v: 'This week' }, { k: 'Crew', v: 'All' }, { k: 'Service', v: 'All' }, { k: 'Payment', v: 'Any' }];
    var data = [
      ['Sep 30', '8:00 AM', 'Olivia Chen', '214 Aspen Ridge Pl SW', 'Deep clean', ['MR', 'JT'], '$96', '$320', '52%', 'Completed', 'Paid'],
      ['Sep 30', '9:30 AM', 'Marcus Webb', '88 Mahogany Blvd SE', 'Standard clean', ['AK'], '$54', '$165', '51%', 'In progress', 'Card on file'],
      ['Sep 30', '10:00 AM', 'Harbor Dental Clinic', '1502 17 Ave SW', 'Commercial', ['LN', 'DS'], '$140', '$410', '49%', 'In progress', 'Due'],
      ['Sep 30', '12:30 PM', 'Priya Natarajan', '31 Cranston Way SE', 'Move-out clean', [], 'No crew', '$385', '–', 'Unassigned', 'Card on file'],
      ['Sep 30', '1:00 PM', 'Hannah Lee', '907 Evanston Dr NW', 'Standard clean', ['MR'], '$54', '$185', '56%', 'Scheduled', 'Failed'],
      ['Sep 30', '2:30 PM', 'Daniel Ortiz', '42 Evergreen Way SW', 'Deep clean', ['JT', 'AK'], '$108', '$340', '47%', 'Scheduled', 'Card on file'],
      ['Sep 30', '4:00 PM', 'Grace Kim', '610 Kensington Rd NW', 'Airbnb turnover', [], 'No crew', '$140', '–', 'Unassigned', 'Due'],
      ['Oct 1', '8:30 AM', 'Samuel Adeyemi', '17 Legacy Cir SE', 'Standard clean', ['LN'], '$54', '$165', '51%', 'Scheduled', 'Card on file'],
      ['Oct 1', '11:00 AM', 'Rachel Moreau', '2250 Bow Trail SW', 'Deep clean', ['DS', 'MR'], '$102', '$310', '48%', 'Scheduled', 'Due'],
      ['Sep 29', '3:00 PM', 'Kevin Tran', '75 Sage Hill Grv NW', 'Standard clean', ['AK'], '$54', '$165', '51%', 'Cancelled', 'Refunded']
    ];
    var rows = data.map(function (d) {
      return {
        date: d[0], time: d[1], client: d[2], address: d[3], type: d[4],
        crew: d[5].map(function (c, k) { var p = av[(c.charCodeAt(0) + k) % 4]; return { i: c, style: 'width: 28px; height: 28px; margin-right: -6px; border-radius: 999px; border: 2px solid #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: ' + p[0] + '; color: ' + p[1] }; }),
        pay: d[6], payStyle: d[5].length ? 'font-size: 13px; color: #3A4A5C; font-variant-numeric: tabular-nums; margin-left: 6px' : 'font-size: 13px; font-weight: 600; color: #B91C1C',
        price: d[7], margin: d[8], status: d[9], payment: d[10],
        badge: self.pill(status[d[9]][0], status[d[9]][1]),
        payBadge: self.pill(pay[d[10]][0], pay[d[10]][1])
      };
    });
    return { accent: accent, sidebarColor: sidebarColor, accentStrong: accentStrong, tabs: tabs, filters: filters, rows: rows };
  }
}
</script>
</body>
</html>
