<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmops – Book a clean</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="MobileCustomerHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #ffffff; color: #0F1B2A; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(30,42,48,0.08)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4-1.8 1.8L4.4 12l9.2-9.2z"></path></svg>
</a>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 12px; font-weight: 700; color: #55657A">Step 2 of 3 · Standard clean</span>
<h1 style="margin: 0; font-size: 20px; font-weight: 800">Your home and time</h1>
</div>
</div>
<div style="display: flex; gap: 6px">
<span style="flex-grow: 1; height: 5px; border-radius: 999px; background: {{accent}}"></span>
<span style="flex-grow: 1; height: 5px; border-radius: 999px; background: {{accent}}"></span>
<span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #E2E8F0"></span>
</div>

<section style="background: #ffffff; border-radius: 16px; padding: 4px 16px; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<sc-for list="{{steppers}}" as="s" hint-placeholder-count="2">
<div style="{{s.row}}">
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{s.label}}</span>
<button type="button" aria-label="{{s.minusLabel}}" onClick="{{s.dec}}" style="width: 44px; height: 44px; border: 1px solid #D7DEE7; border-radius: 12px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 20px; font-weight: 700">−</button>
<span style="width: 36px; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">{{s.value}}</span>
<button type="button" aria-label="{{s.plusLabel}}" onClick="{{s.inc}}" style="width: 44px; height: 44px; border: 1px solid #D7DEE7; border-radius: 12px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 20px; font-weight: 700">+</button>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Pick a day</h2>
<div style="display: flex; gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="{{d.style}}">
<span style="font-size: 12px; font-weight: 700">{{d.dow}}</span>
<span style="font-size: 20px; font-weight: 800">{{d.num}}</span>
</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Arrival time</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{times}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" disabled="{{t.disabled}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Add-ons</h2>
<div style="background: #ffffff; border-radius: 16px; padding: 0 16px; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<sc-for list="{{addons}}" as="a" hint-placeholder-count="3">
<label style="{{a.row}}">
<input type="checkbox" checked="{{a.on}}" onChange="{{a.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{accentStrong}}">
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{a.label}}</span>
<span style="font-size: 14px; font-weight: 700; color: #3A4A5C; font-variant-numeric: tabular-nums">{{a.price}}</span>
</label>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 20px 28px; background: #ffffff; border-top: 1px solid #E5EAF0; display: flex; align-items: center; gap: 14px">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">{{total}}</span>
<span style="font-size: 12px; font-weight: 600; color: #55657A">{{summary}}</span>
</div>
<button type="button" style="height: 52px; padding: 0 26px; border: 0; border-radius: 14px; background: {{accentStrong}}; color: #ffffff; font: inherit; font-size: 16px; font-weight: 800">Continue</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { beds: 3, baths: 2, day: 1, time: 1, addons: { fridge: true, oven: false, windows: false } }; }
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  mix(hex, a) { return this.hex(this.rgb(hex).map(function (v) { return v + (255 - v) * a; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var self = this, s = this.state;
    var accent = this.props.accent ?? '#1B9ADB';
    var accentStrong = this.vivid(accent);
    var accentTint = this.mix(accent, 0.88);
    var accentDeep = this.shade(accent, 0.55);
    var clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };
    var steppers = [
      { key: 'beds', label: 'Bedrooms', lo: 1, hi: 8 },
      { key: 'baths', label: 'Bathrooms', lo: 1, hi: 6 }
    ].map(function (x, i) {
      var o = {};
      return { label: x.label, value: s[x.key], minusLabel: 'Fewer ' + x.label.toLowerCase(), plusLabel: 'More ' + x.label.toLowerCase(),
        dec: function () { o[x.key] = clamp(s[x.key] - 1, x.lo, x.hi); self.setState(o); },
        inc: function () { o[x.key] = clamp(s[x.key] + 1, x.lo, x.hi); self.setState(o); },
        row: 'display: flex; align-items: center; gap: 8px; height: 60px;' + (i === 0 ? ' border-bottom: 1px solid #F1F5F9' : '') };
    });
    var dayList = [['Thu', 1], ['Fri', 2], ['Sat', 3], ['Mon', 5], ['Tue', 6]];
    var days = dayList.map(function (d, i) {
      var on = s.day === i;
      return { dow: d[0], num: d[1], on: on ? 'true' : 'false', pick: function () { self.setState({ day: i }); },
        style: 'flex-grow: 1; flex-basis: 0; height: 68px; border-radius: 14px; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ' + (on ? 'border: 0; background: ' + accentStrong + '; color: #ffffff' : 'border: 1px solid #E5EAF0; background: #ffffff; color: #0F1B2A') };
    });
    var timeList = [['8:00 AM', 0], ['9:00 AM', 0], ['10:30 AM', 0], ['12:00 PM', 0], ['1:30 PM', 1], ['3:00 PM', 0]];
    var times = timeList.map(function (t, i) {
      var on = s.time === i, full = !!t[1];
      return { label: full ? 'Full' : t[0], on: on ? 'true' : 'false', disabled: full, pick: function () { if (!full) self.setState({ time: i }); },
        style: 'height: 46px; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; ' + (full ? 'border: 1px dashed #CBD5E1; background: transparent; color: #55657A' : on ? 'border: 2px solid ' + accentStrong + '; background: ' + accentTint + '; color: ' + accentDeep : 'border: 1px solid #E5EAF0; background: #ffffff; color: #0F1B2A') };
    });
    var addDefs = [['fridge', 'Inside fridge', 40], ['oven', 'Inside oven', 40], ['windows', 'Interior windows', 60]];
    var addTotal = 0;
    var addons = addDefs.map(function (a, i) {
      var on = !!s.addons[a[0]];
      if (on) addTotal += a[2];
      return { label: a[1], price: '+$' + a[2], on: on,
        toggle: function () { var n = Object.assign({}, s.addons); n[a[0]] = !on; self.setState({ addons: n }); },
        row: 'display: flex; align-items: center; gap: 12px; height: 52px; cursor: pointer;' + (i < addDefs.length - 1 ? ' border-bottom: 1px solid #F1F5F9' : '') };
    });
    var base = 110 + 20 * s.beds + 15 * s.baths;
    var d = dayList[s.day], t = timeList[s.time];
    return { accent: accent, accentStrong: accentStrong, steppers: steppers, days: days, times: times, addons: addons,
      total: '$' + (base + addTotal), summary: d[0] + ', Oct ' + d[1] + ' · ' + t[0] + ' · before tax' };
  }
}
</script>
</body>
</html>
