<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My pay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; overflow: hidden">
<dc-import name="CleanerSidebar" active="My pay" accent="{{accent}}" sidebar="{{sidebarColor}}" hint-size="248px,900px"></dc-import>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; background: #ffffff; border-bottom: 1px solid #E5EAF0; display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700; flex-grow: 1">My pay</h1>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #D7DEE7; border-radius: 8px; background: #ffffff; color: #0F1B2A; font: inherit; font-size: 14px; font-weight: 600">Download T4A</button>
</header>
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px; display: flex; gap: 20px">
<div style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px">
<section style="background: {{accentStrong}}; color: #ffffff; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Available to withdraw</span>
<span style="font-size: 44px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">$642.50</span>
<span style="font-size: 13px">Next automatic payout Fri, Oct 2 to TD ••• 0192</span>
<button type="button" style="margin-top: 12px; height: 44px; border: 0; border-radius: 8px; background: #ffffff; color: {{accentDeep}}; font: inherit; font-size: 15px; font-weight: 700">Withdraw now · $1.50 fee</button>
</section>
<section style="background: #ffffff; border: 1px solid #E5EAF0; border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">This pay period</h2>
<sc-for list="{{period}}" as="p" hint-placeholder-count="5">
<div style="display: flex; font-size: 14px"><span style="flex-grow: 1; color: #3A4A5C">{{p.k}}</span><span style="{{p.vStyle}}">{{p.v}}</span></div>
</sc-for>
</section>
</div>
<section style="flex-grow: 1; min-width: 0; background: #ffffff; border: 1px solid #E5EAF0; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; border-bottom: 1px solid #E5EAF0; display: flex; align-items: center">
<h2 style="margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1">Activity</h2>
<span style="font-size: 13px; color: #55657A">Sep 21 – Oct 4</span>
</div>
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<thead>
<tr style="background: #F8FAFC; height: 42px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #55657A">
<th style="padding: 0 12px 0 20px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Date</th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Details</th>
<th style="padding: 0 12px; font-weight: 700; text-align: right; border-bottom: 1px solid #E5EAF0">Hours</th>
<th style="padding: 0 12px; font-weight: 700; border-bottom: 1px solid #E5EAF0">Status</th>
<th style="padding: 0 20px 0 12px; font-weight: 700; text-align: right; border-bottom: 1px solid #E5EAF0">Amount</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr style="height: 54px; border-bottom: 1px solid #F1F5F9">
<td style="padding: 0 12px 0 20px; color: #3A4A5C; white-space: nowrap">{{r.date}}</td>
<td style="padding: 0 12px"><div style="font-weight: 600">{{r.t}}</div><div style="font-size: 12px; color: #55657A">{{r.sub}}</div></td>
<td style="padding: 0 12px; text-align: right; font-variant-numeric: tabular-nums; color: #3A4A5C">{{r.hours}}</td>
<td style="padding: 0 12px"><span style="{{r.badge}}">{{r.status}}</span></td>
<td style="{{r.amtStyle}}">{{r.amt}}</td>
</tr>
</sc-for>
</tbody>
</table>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var accentDeep = this.shade(accent, 0.55);
    var num = 'font-weight: 600; font-variant-numeric: tabular-nums';
    var period = [
      { k: 'Job pay · 31.5 h', v: '$756.00', vStyle: num },
      { k: 'Tips', v: '$64.00', vStyle: num },
      { k: 'Mileage · 142 km', v: '$38.50', vStyle: num },
      { k: 'Kit write-off', v: '−$16.00', vStyle: num + '; color: #B91C1C' },
      { k: 'Already withdrawn', v: '−$200.00', vStyle: num }
    ];
    var pill = function (bg, fg) { return 'display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: ' + bg + '; color: ' + fg; };
    var S = { 'Pending': pill('#FEF3C7', '#92400E'), 'Approved': pill('#DCFCE7', '#15803D'), 'Paid out': pill('#F1F5F9', '#475569') };
    var amt = function (neg) { return 'padding: 0 20px 0 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (neg ? '#0F1B2A' : '#15803D'); };
    var data = [
      ['Sep 30', 'Olivia Chen · Deep clean', 'Today, waiting for approval', '3.0', 'Pending', '+$72.00', 0],
      ['Sep 30', 'Tip · Olivia Chen', 'Added by client', '–', 'Pending', '+$24.00', 0],
      ['Sep 29', 'Kevin Tran · Standard', 'Approved by Emily W.', '2.0', 'Approved', '+$48.00', 0],
      ['Sep 28', 'Sofia Rossi · Deep clean', 'Approved by Emily W.', '3.5', 'Approved', '+$84.00', 0],
      ['Sep 28', 'Mileage', '38 km across 3 jobs', '–', 'Approved', '+$10.30', 0],
      ['Sep 26', 'Withdrawal to TD ••• 0192', 'Instant · $1.50 fee', '–', 'Paid out', '−$200.00', 1],
      ['Sep 25', 'Harbor Dental · Commercial', 'Approved by Prem S.', '4.0', 'Approved', '+$100.00', 0],
      ['Sep 24', 'Amelia Brooks · Standard', 'Approved by Emily W.', '2.0', 'Approved', '+$48.00', 0],
      ['Sep 23', 'Kit write-off', 'Mop head, 2 microfibre cloths', '–', 'Approved', '−$16.00', 1],
      ['Sep 22', 'Grace Kim · Airbnb turnover', 'Approved by Emily W.', '1.5', 'Approved', '+$36.00', 0]
    ];
    var rows = data.map(function (d) {
      return { date: d[0], t: d[1], sub: d[2], hours: d[3], status: d[4], amt: d[5], badge: S[d[4]], amtStyle: amt(d[6]) };
    });
    return { accent: accent, sidebarColor: sidebarColor, accentStrong: accentStrong, accentDeep: accentDeep, period: period, rows: rows };
  }
}
</script>
</body>
</html>
