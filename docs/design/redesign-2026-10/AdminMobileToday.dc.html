<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmops Pro – Admin today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:#F4F7FB;color:#0F1B2A}
a{color:#077AB4}a:hover{color:#055E8C}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F4F7FB; font-family: Figtree, system-ui, sans-serif; color: #0F1B2A; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 13px; font-weight: 600; color: #55657A">Wednesday, Sep 30 · Calgary</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Operations</h1>
</div>
<span style="width: 44px; height: 44px; border-radius: 999px; background: {{accentTint}}; color: {{accentDeep}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">PS</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #ffffff; border-radius: 16px; padding: 14px 0; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-right: 1px solid #E5EAF0"><span style="font-size: 24px; font-weight: 800">12</span><span style="font-size: 12px; font-weight: 600; color: #55657A">Jobs today</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-right: 1px solid #E5EAF0"><span style="font-size: 24px; font-weight: 800">6</span><span style="font-size: 12px; font-weight: 600; color: #55657A">On shift</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 24px; font-weight: 800">$8.4k</span><span style="font-size: 12px; font-weight: 600; color: #55657A">This week</span></div>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FEE2E2">
<div style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px">
<span style="font-size: 16px; font-weight: 800; color: #991B1B">3 jobs have no crew</span>
<span style="font-size: 13px; color: #991B1B">Next one starts 12:30 PM · Cranston</span>
</div>
<a href="AdminMobileAssign.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #DC2626; color: #ffffff; font-size: 14px; font-weight: 800; text-decoration: none; display: flex; align-items: center">Assign</a>
</div>

<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center">
<h2 style="margin: 0; font-size: 17px; font-weight: 800; flex-grow: 1">Live now</h2>
<a href="#" style="font-size: 14px; font-weight: 700; text-decoration: none">Map</a>
</div>
<div style="background: #ffffff; border-radius: 16px; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<sc-for list="{{live}}" as="l" hint-placeholder-count="4">
<div style="{{l.row}}">
<span style="{{l.av}}">{{l.crew}}</span>
<div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; gap: 1px">
<span style="font-size: 14px; font-weight: 700">{{l.job}}</span>
<span style="font-size: 12px; color: #55657A">{{l.who}}</span>
</div>
<span style="{{l.badge}}">{{l.state}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Waiting on you</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{waiting}}" as="w" hint-placeholder-count="3">
<a href="{{w.href}}" style="height: 76px; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: #ffffff; color: #0F1B2A; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 2px rgba(30,42,48,0.06)">
<span style="font-size: 24px; font-weight: 800; color: {{accentStrong}}">{{w.n}}</span>
<span style="font-size: 12px; font-weight: 700">{{w.label}}</span>
</a>
</sc-for>
</div>
</section>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 999px; background: {{sidebarColor}}; display: flex; box-shadow: 0 10px 24px rgba(30,42,48,0.28)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="{{t.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span style="font-size: 11px; font-weight: 700">{{t.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1B9ADB","options":["#1B9ADB","#1289E8","#13B5C6"]},"sidebarColor":{"editor":"color","default":"#2B3337","options":["#2B3337","#3A4449","#536369"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(hex) {
    var h = String(hex || '#1B9ADB').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  hex(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return ('0' + v.toString(16)).slice(-2); }).join(''); }
  shade(hex, f) { return this.hex(this.rgb(hex).map(function (v) { return v * f; })); }
  mix(hex, a) { return this.hex(this.rgb(hex).map(function (v) { return v + (255 - v) * a; })); }
  vivid(hex) { var c = this.rgb(hex); var mn = Math.min(c[0], c[1], c[2]); return this.hex(c.map(function (v) { return (v - mn * 0.7) * 0.9; })); }
  renderVals() {
    var accent = this.props.accent ?? '#1B9ADB';
    var sidebarColor = this.props.sidebarColor ?? '#2B3337';
    var accentStrong = this.vivid(accent);
    var accentDeep = this.shade(accent, 0.55);
    var accentTint = this.mix(accent, 0.86);
    var deep = this.shade(sidebarColor, 0.62);
    var pill = function (bg, fg) { return 'height: 24px; padding: 0 9px; display: flex; align-items: center; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; background: ' + bg + '; color: ' + fg; };
    var pal = [['#E0F2FE', '#0369A1'], ['#EDE9FE', '#6D28D9'], ['#FEF3C7', '#92400E'], ['#DCFCE7', '#15803D']];
    var live = [
      ['A', 'Olivia Chen · Deep clean', 'Maria R., Jordan T.', '1:40 on site', 0],
      ['B', 'Marcus Webb · Standard', 'Aisha K.', '0:52 on site', 0],
      ['D', 'Harbor Dental · Commercial', 'Leo N., Dana S.', '1:10 on site', 0],
      ['C', 'To Hannah Lee', 'Chris M.', 'ETA 12 min', 1]
    ].map(function (l, i) {
      var p = pal[i % 4];
      return { crew: l[0], job: l[1], who: l[2], state: l[3],
        row: 'display: flex; align-items: center; gap: 12px; padding: 10px 14px;' + (i < 3 ? ' border-bottom: 1px solid #F1F5F9' : ''),
        av: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; background: ' + p[0] + '; color: ' + p[1],
        badge: l[4] ? pill('#E0F2FE', '#0369A1') : pill('#DCFCE7', '#15803D') };
    });
    var waiting = [
      { n: '4', label: 'Time to approve', href: 'AdminMobileApprove.dc.html' },
      { n: '2', label: 'Quotes to send', href: '#' },
      { n: '7', label: 'Unread chats', href: '#' }
    ];
    var I = {
      today: 'M12 3 2 11h3v9h5v-6h4v6h5v-9h3z',
      jobs: 'M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1zm-1 9v2h8v-2zm0 4v2h5v-2z',
      team: 'M9 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 7 2 7 5v2H2v-2c0-3 2.6-5 7-5zm8-9a3.5 3.5 0 1 1 0 7zm1.5 9c2.5.5 4.5 2 4.5 4.5V21h-4v-2c0-1.8-.7-3.5-2-4.7z',
      chat: 'M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z',
      more: 'M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z'
    };
    var tabs = [['Today', I.today, 'AdminMobileToday.dc.html'], ['Jobs', I.jobs, 'AdminMobileAssign.dc.html'], ['Team', I.team, 'AdminMobileApprove.dc.html'], ['Chat', I.chat, '#'], ['More', I.more, '#']].map(function (t, i) {
      var on = i === 0;
      return { label: t[0], d: t[1], href: t[2],
        style: 'flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; text-decoration: none; ' + (on ? 'background: #ffffff; color: ' + deep : 'color: #ffffff') };
    });
    return { sidebarColor: sidebarColor, accentStrong: accentStrong, accentDeep: accentDeep, accentTint: accentTint, live: live, waiting: waiting, tabs: tabs };
  }
}
</script>
</body>
</html>
