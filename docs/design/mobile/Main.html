      <input id="pro-email" type="email" value="amara.k@cleano.ca" style="height: 52px; box-sizing: border-box; padding: 0 16px; font-family: inherit; font-size: 15px; color: #0e1a1c; background: #f3f6f9; border: 1px solid rgba(0,140,156,0.15); border-radius: 12px;">
