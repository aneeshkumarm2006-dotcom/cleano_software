<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Cleano</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5f1e8;
        color: #0f2a2e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        background: #fff;
        border: 1px solid rgba(0, 140, 156, 0.14);
        border-radius: 18px;
        padding: 32px 26px;
        max-width: 360px;
        box-shadow: 0 12px 32px rgba(0, 60, 70, 0.1);
      }
      .dot {
        width: 46px; height: 46px; margin: 0 auto 16px;
        border-radius: 14px;
        background: rgba(0, 140, 156, 0.1);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px;
      }
      h1 { font-size: 19px; margin: 0 0 8px; font-weight: 600; }
      p { font-size: 14px; line-height: 1.55; color: #3d7f87; margin: 0 0 20px; }
      button {
        background: #008c9c; color: #fff; border: 0;
        border-radius: 11px; padding: 11px 22px;
        font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">📶</div>
      <h1>You're offline</h1>
      <p>
        Cleano needs a connection to load your jobs and schedule. Reconnect and
        try again — nothing you've entered is lost.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
